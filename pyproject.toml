[project]
name = "memory-microstructure-analysis"
version = "0.1.0"
description = "メモリ半導体 perp の銘柄横断マイクロストラクチャー分析"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "exchange-calendars>=4.5",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=16",
    "statsmodels>=0.14",
]

[tool.uv]
package = false
